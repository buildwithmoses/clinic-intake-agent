[project]
name = "clinic-intake-agent"
version = "0.1.0"
description = "Deep Agents deployment for a (fictional) family clinic: intake extraction, cited policy answers, and human-approved urgent triage."
readme = "README.md"
authors = [{ name = "Henry Moses Jr" }]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
clinic-demo = "clinic_intake_agent.demo:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.39",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
